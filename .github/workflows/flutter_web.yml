name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master # Triggers on push to either main or master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web App
        # IMPORTANT: Replace <YOUR_REPO_NAME> with the EXACT name of your GitHub repository.
        # Example: if your repo URL is github.com/praka/marudhu-restaurant
        # Then replace this with: flutter build web --base-href "/marudhu-restaurant/"
        run: flutter build web --base-href "/marudhuhotels/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
